<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - Cardiovascular Tracker</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>

  <!-- Styles -->
  <link rel="stylesheet" href="css/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- JS Logic -->
  <script type="module" src="js/dashboard.js"></script>
</head>
<body>
  <header>
    <div class="logo">
      <a href="dashboard.html">
        <img src="images/logo.png" alt="Logo" />
      </a>
      <span class="app-title">Cardiovascular Biometric Tracker</span>
    </div>
    <div class="user-controls">
      <span id="usernameDisplay">User</span>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <div class="sensor-values">
    <button class="sensor-btn" onclick="location.href='ecg.html'">ECG</button>
    <button class="sensor-btn" onclick="location.href='ppg.html'">PPG</button>
    <button class="sensor-btn" onclick="location.href='temperature.html'">Temperature</button>
  </div>

  <main class="dashboard-container">
    <!-- Left (Graphs) -->
    <div class="left-side">
      <div class="sensor-box large-box ecg-box">
        <div class="ecg-graph">
          <h2>ECG Signal</h2>
          <canvas id="ecgDashboardChart"></canvas>
        </div>
        <span class="sensor-value" id="dashboardECGValue">-- V</span>
      </div>

      <div class="sensor-box large-box ppg-box">
        <div class="ppg-graph">
          <h2>PPG Signal</h2>
          <canvas id="ppgDashboardChart"></canvas>
        </div>
        <span class="sensor-value" id="ppgValue">--</span>
      </div>
    </div>

    <!-- Right (Values) -->
    <div class="right-side">
      <div class="sensor-box small-box">
        <h2>Temperature</h2>
        <span class="sensor-value" id="dashboardTemperature">-- °C</span>
      </div>

      <div class="sensor-box small-box">
        <h2>Heart Rate</h2>
        <span class="sensor-value2" id="dashboardHeartRate">-- BPM</span>
      </div>
    </div>
  </main>
</body>
</html>
